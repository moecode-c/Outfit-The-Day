name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run (adds Firefox/WebKit/iPhone Safari) to catch drift from dependencies and browsers.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      all_browsers:
        description: Also run the cross-browser E2E suite (Firefox, WebKit, iPhone Safari)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # Test-only values; the API never honours THROTTLE_DISABLED when NODE_ENV=production.
  MONGODB_URI: mongodb://localhost:27017/otd_test
  JWT_ACCESS_SECRET: ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  WEB_ORIGIN: http://localhost:3000
  THROTTLE_DISABLED: 'true'
  # Baked into the Next.js build (rewrites) — keep identical in every job that uses the build.
  API_URL: http://localhost:4000
  SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1
  FORCE_COLOR: 1

jobs:
  # ── Workflow files themselves ────────────────────────────────────────────────
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # ── Static checks ────────────────────────────────────────────────────────────
  quality:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint (api + web)
        run: pnpm -r lint
      - name: Type-check (api + web)
        run: pnpm -r typecheck
      - name: No stray .only in tests
        run: |
          if grep -rnE '\b(test|it|describe)\.only\(' apps/*/src apps/*/test apps/web/e2e 2>/dev/null; then
            echo "::error::Remove .only() from the tests above"; exit 1
          fi

  # ── Unit tests on the supported Node versions ────────────────────────────────
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { node-version: '${{ matrix.node }}' }
      - name: API unit tests (pricing, coupons, search, validators, env, mail, storage)
        run: pnpm --filter api test --ci --coverage --coverageReporters=json-summary --coverageReporters=lcov --coverageReporters=text-summary
      - name: Web unit tests (formatting, i18n parity, middleware, SEO)
        run: pnpm --filter web exec vitest run --coverage
      - name: Coverage summary
        if: matrix.node == 24
        run: |
          node -e '
            const fs = require("fs");
            const rows = [["API (Jest)", "apps/api/coverage/coverage-summary.json"], ["Web (Vitest)", "apps/web/coverage/coverage-summary.json"]];
            let md = "### Unit test coverage\n\n| Suite | Lines | Statements | Functions | Branches |\n|---|---|---|---|---|\n";
            for (const [name, file] of rows) {
              if (!fs.existsSync(file)) continue;
              const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
              md += `| ${name} | ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |\n`;
            }
            md += "\nIntegration, scenario and browser suites cover the rest of the code; unit coverage is reported, not enforced.\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: unit-coverage
          path: |
            apps/api/coverage
            apps/web/coverage
          retention-days: 14

  # ── Production build, shared by every job that runs the app ──────────────────
  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build-shared: 'false' }
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/messages/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build shared, API and web
        run: pnpm build
      - name: Build size summary
        run: |
          {
            echo "### Build output"
            echo
            echo "| Output | Size |"
            echo "|---|---|"
            echo "| apps/api/dist | $(du -sh apps/api/dist | cut -f1) |"
            echo "| apps/web/.next (without cache) | $(du -sh --exclude=cache apps/web/.next | cut -f1) |"
            echo "| apps/web/.next/static (client JS/CSS) | $(du -sh apps/web/.next/static | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build
          include-hidden-files: true
          retention-days: 3
          path: |
            packages/shared/dist
            apps/api/dist
            apps/web/.next
            !apps/web/.next/cache

  # ── API integration on every supported MongoDB version ───────────────────────
  api:
    name: API integration (MongoDB ${{ matrix.mongo }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mongo: ['7', '8']
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      API: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build-shared: 'false' }
      - uses: actions/download-artifact@v4
        with: { name: build }
      - uses: ./.github/actions/start-stack
        with: { web: 'false' }
      - name: Integration tests (auth, roles, catalog, cart, checkout, files, exports, security headers)
        run: pnpm --filter api test:int
      - name: Re-seed for the scenario run
        run: pnpm --filter api seed
      - name: Full marketplace scenario (orders → fulfilment → InstaPay → returns → billing)
        run: pnpm --filter api test:e2e
      - name: Backup → wipe → restore round trip
        run: pnpm --filter api test:backup
      - name: Production-mode boot checks (config guard, HSTS, CORS, Secure cookies, rate limiting)
        env:
          PROD_MONGODB_URI: mongodb://otd-mongo:27017/otd_prod_smoke
        run: |
          # Production refuses localhost database URLs, so reach the service through another name.
          echo "127.0.0.1 otd-mongo" | sudo tee -a /etc/hosts
          MONGODB_URI=mongodb://localhost:27017/otd_prod_smoke pnpm --filter api seed
          pnpm --filter api test:prod-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'api-log-mongo-${{ matrix.mongo }}', path: api.log, retention-days: 7 }

  # ── Browser end-to-end + side tests (smoke, a11y, security) ──────────────────
  e2e:
    name: E2E (${{ matrix.suite == 'cross' && 'Firefox, WebKit, iPhone Safari' || 'Chromium desktop + mobile' }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Cross-browser only on the nightly run or when asked for on a manual run.
        suite: ${{ fromJSON((github.event_name == 'schedule' || inputs.all_browsers) && '["chromium","cross"]' || '["chromium"]') }}
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WEB_URL: http://localhost:3000
      PW_ALL_BROWSERS: ${{ matrix.suite == 'cross' && '1' || '' }}
      BROWSERS: ${{ matrix.suite == 'cross' && 'firefox webkit' || 'chromium' }}
      PROJECTS: ${{ matrix.suite == 'cross' && '--project=firefox --project=webkit --project=mobile-safari' || '--project=desktop --project=mobile' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build-shared: 'false' }
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.suite }}
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps $BROWSERS
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps $BROWSERS
      - uses: ./.github/actions/start-stack
      - name: Playwright
        run: pnpm --filter web exec playwright test $PROJECTS
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'playwright-report-${{ matrix.suite }}', path: apps/web/playwright-report, retention-days: 14, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-and-logs-${{ matrix.suite }}
          path: |
            apps/web/test-results
            api.log
            web.log
          retention-days: 7

  # ── Lighthouse: accessibility (enforced), performance/SEO/best practices (reported)
  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build-shared: 'false' }
      - uses: actions/download-artifact@v4
        with: { name: build }
      - uses: ./.github/actions/start-stack
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.github/lighthouse/lighthouserc.json
      - name: Scores summary
        if: always()
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = ".lighthouseci";
            if (!fs.existsSync(dir)) process.exit(0);
            const best = {};
            for (const f of fs.readdirSync(dir).filter((f) => /^lhr-.*\.json$/.test(f))) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              const url = new URL(r.finalDisplayedUrl ?? r.finalUrl).pathname + new URL(r.finalDisplayedUrl ?? r.finalUrl).search;
              const s = Object.fromEntries(Object.entries(r.categories).map(([k, v]) => [k, Math.round(v.score * 100)]));
              if (!best[url] || s.performance > best[url].performance) best[url] = s;
            }
            let md = "### Lighthouse (best of runs)\n\n| Page | Performance | Accessibility | Best practices | SEO |\n|---|---|---|---|---|\n";
            for (const [u, s] of Object.entries(best)) md += `| ${u} | ${s.performance} | ${s.accessibility} | ${s["best-practices"]} | ${s.seo} |\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse-report, path: .lighthouseci, include-hidden-files: true, retention-days: 14, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: lighthouse-logs, path: '*.log', retention-days: 7 }

  # ── Secrets committed to git history ─────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # ── New dependencies in a PR (licence + known vulnerabilities) ───────────────
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Dependency audit (report only; does not block merges) ────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: pnpm audit --prod --audit-level=high

  # ── Single required check for branch protection ──────────────────────────────
  ci-ok:
    name: CI passed
    if: always()
    needs: [workflow-lint, quality, unit, build, api, e2e, lighthouse, secrets, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more required jobs failed"; exit 1
          fi
