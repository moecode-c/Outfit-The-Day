version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch updates; majors arrive one by one so they can be reviewed.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: browser binaries + CI cache key, and the framework pair.
      - dependency-name: '@playwright/test'
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
