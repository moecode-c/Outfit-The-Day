name: Setup workspace
description: pnpm + Node (with pnpm store cache), frozen install, optional @otd/shared build.

inputs:
  node-version:
    description: Node.js version
    default: '24'
  build-shared:
    description: Build @otd/shared after install
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build @otd/shared
      if: inputs.build-shared == 'true'
      shell: bash
      run: pnpm --filter @otd/shared build
